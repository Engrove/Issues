name: Missing data
description: Submit a missing value for an existing Engrove Audio Tools database item.
title: "[Missing data] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form when an item already exists in Engrove Audio Tools, but one or more useful values are missing, unknown, or incomplete.

        Reports are public. Do not include personal information, credentials, private correspondence, or purchase records.

  - type: dropdown
    id: database
    attributes:
      label: Database or area
      description: Which database contains the existing item?
      options:
        - Cartridges
        - Tonearms
        - Null points / alignment data
        - Test records
        - Turntables or related equipment
        - Other
    validations:
      required: true

  - type: input
    id: item_name
    attributes:
      label: Existing item name
      description: Use the exact manufacturer and model shown in Engrove Audio Tools.
      placeholder: "Example: SME 3009 Series II Improved"
    validations:
      required: true

  - type: input
    id: item_id
    attributes:
      label: Engrove record ID or page URL
      description: Add the record ID, database page URL, or the Engrove tool route where the field is missing.
      placeholder: "Example: tonearm:1234:sme-3009 or https://engroveaudio.com/..."
    validations:
      required: false

  - type: input
    id: variant
    attributes:
      label: Variant, version, or production revision
      description: State any relevant generation, length, output version, stylus revision, market variant, or date range.
      placeholder: "Example: MkII, 9 inch, Improved, low output"
    validations:
      required: false

  - type: input
    id: missing_field
    attributes:
      label: Missing field
      description: Which field or value are you submitting?
      placeholder: "Example: effective_mass_g, compliance_10hz_cu, mounting_distance_mm"
    validations:
      required: true

  - type: textarea
    id: suggested_value
    attributes:
      label: Suggested value
      description: Enter the missing value, unit, measurement frequency, range, and relevant conditions.
      placeholder: |
        Field:
        Value or range:
        Unit:
        Frequency or test condition:
      render: yaml
    validations:
      required: true

  - type: textarea
    id: source_urls
    attributes:
      label: Source URLs
      description: Provide one URL per line. Manufacturer pages, manuals, and official datasheets are preferred.
      placeholder: |
        https://manufacturer.example/product
        https://manufacturer.example/manual.pdf
    validations:
      required: true

  - type: dropdown
    id: strongest_source_type
    attributes:
      label: Strongest source type
      options:
        - Manufacturer / official product page
        - Manufacturer manual / service manual / datasheet
        - Official distributor documentation
        - Independent measurement with method stated
        - Specialist publication
        - Forum / community material
        - Other or unknown
    validations:
      required: true

  - type: textarea
    id: evidence_notes
    attributes:
      label: Evidence and interpretation notes
      description: Explain how the source maps to the exact model or variant, and describe any conversion, estimate, or conflicting source.
      placeholder: "Describe the source match, uncertainty, conversion, and conflicting values."
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or document excerpts
      description: Drag screenshots or short relevant excerpts here. Do not upload entire copyrighted manuals unless redistribution is permitted.
    validations:
      required: false

  - type: checkboxes
    id: submitter_check
    attributes:
      label: Submission checks
      options:
        - label: I understand that this public report is reviewed before any dataset change is made.
          required: true
        - label: I have identified the exact model or variant as accurately as possible.
          required: true
        - label: I have included the strongest source I could find and have not included sensitive information.
          required: true
